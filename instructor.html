<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZICT Instructor — Grading Dashboard</title>
<style>
:root{--blue:#1a3c6e;--gold:#f5a623;--border:#dde3ea}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#f0f4f8;color:#333}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#1a3c6e,#0d2644);
  display:grid;place-items:center;z-index:99}
#login .card{background:#fff;border-radius:12px;padding:36px;width:340px}
#login h2{color:var(--blue);margin:0 0 16px}
#login input{width:100%;padding:11px;margin-bottom:10px;border:1px solid #ccd;border-radius:6px}
#login button{width:100%;padding:11px;border:0;border-radius:6px;background:var(--gold);
  font-weight:700;cursor:pointer}
#err{color:#c0392b;font-size:13px;min-height:18px}
header{background:var(--blue);color:#fff;padding:12px 24px;display:flex;
  align-items:center;gap:16px}
header h1{font-size:1.1em;margin:0;flex:1}
header button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  color:#fff;padding:6px 14px;border-radius:5px;cursor:pointer}
.wrap{display:grid;grid-template-columns:280px 1fr;gap:20px;padding:20px;
  max-width:1400px;margin:0 auto;align-items:start}
.panel{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px}
.panel h3{margin:0 0 12px;color:var(--blue);font-size:.95em}
.student{padding:10px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.student:hover{background:#f0f4f8}
.student.active{background:#e8f4fd;border-color:var(--blue)}
.student .nm{font-weight:600;font-size:14px}
.student .em{font-size:12px;color:#777}
.student .pc{font-size:12px;color:#27ae60;font-weight:600}
.unit{border:1px solid var(--border);border-radius:8px;margin-bottom:14px;overflow:hidden}
.unit h4{margin:0;padding:10px 14px;background:#f8f9fa;border-bottom:1px solid var(--border);
  font-size:14px;display:flex;align-items:center;gap:10px}
.unit h4 .badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700}
.b-sub{background:#fff3cd;color:#856404}
.b-graded{background:#eafaf1;color:#1a7a42}
.unit-body{padding:14px}
.ev{font-size:13px;padding:3px 0}
.ev.on::before{content:'☑ ';color:#27ae60}
.ev.off::before{content:'☐ ';color:#bbb}
.meta{font-size:13px;margin:10px 0;padding:10px;background:#f8f9fa;border-radius:5px}
.meta a{color:var(--blue)}
.grade-row{display:flex;gap:10px;align-items:flex-end;margin-top:12px;flex-wrap:wrap}
.grade-row label{font-size:12px;font-weight:600;display:block;margin-bottom:4px}
.grade-row input[type=number]{width:80px;padding:8px;border:1px solid #ccd;border-radius:5px}
.grade-row textarea{flex:1;min-width:200px;padding:8px;border:1px solid #ccd;
  border-radius:5px;min-height:38px;font-family:inherit;font-size:13px}
.grade-row button{background:#27ae60;color:#fff;border:0;padding:9px 18px;
  border-radius:5px;font-weight:700;cursor:pointer}
.hint{font-size:12px;color:#888;margin-top:8px}
#status{font-size:13px;color:#27ae60;min-height:18px;padding:0 24px}
.empty{color:#999;text-align:center;padding:40px;font-size:14px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <h2>Instructor Login</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="pass" type="password" placeholder="Password">
    <button id="signin">Sign In</button>
    <p id="err"></p>
  </div>
</div>

<header hidden id="bar">
  <h1>ZICT Grading Dashboard</h1>
  <span id="who"></span>
  <button id="refresh">Refresh</button>
  <button id="out">Sign Out</button>
</header>
<div id="status"></div>

<div class="wrap" id="app" hidden>
  <div class="panel">
    <h3>Students</h3>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>
  <div class="panel">
    <h3 id="who-title">Select a student</h3>
    <div id="detail"><div class="empty">Pick a student from the list.</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, setDoc, getDoc, collection, getDocs, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

/* ---------- CONFIG — SAME AS STUDENT FILE ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyDV4EQrkLl2wUF96Xk8_yYaH1PiRZS_gd0",
  authDomain: "zict-workbook.firebaseapp.com",
  projectId: "zict-workbook",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

$('signin').onclick = () =>
  signInWithEmailAndPassword(auth, $('email').value.trim(), $('pass').value)
    .catch(e => $('err').textContent = e.message);
$('out').onclick = () => signOut(auth);
$('refresh').onclick = () => loadStudents();
$('pass').addEventListener('keydown', e => { if (e.key==='Enter') $('signin').click(); });

let students = [], current = null;

onAuthStateChanged(auth, user => {
  $('login').hidden = !!user;
  $('bar').hidden = !user;
  $('app').hidden = !user;
  if (user) { $('who').textContent = user.email; loadStudents(); }
});

async function loadStudents() {
  $('list').innerHTML = '<div class="empty">Loading…</div>';
  try {
    const snap = await getDocs(collection(db, 'progress'));
    students = [];
    snap.forEach(d => students.push({ uid: d.id, ...d.data() }));
    students.sort((a,b) => (a.name||a.email||'').localeCompare(b.name||b.email||''));
    renderList();
  } catch (e) {
    $('list').innerHTML = `<div class="empty">Error: ${e.message}<br><br>
      Check your instructor UID is in the Firestore rules.</div>`;
  }
}

function pctOf(f) {
  const keys = Object.keys(f||{}).filter(k => /\.e\d+$/.test(k));
  if (!keys.length) return 0;
  const on = keys.filter(k => f[k] === true).length;
  return Math.round(on / keys.length * 100);
}

function renderList() {
  if (!students.length) {
    $('list').innerHTML = '<div class="empty">No students yet.</div>';
    return;
  }
  $('list').innerHTML = students.map(s => `
    <div class="student" data-uid="${s.uid}">
      <div class="nm">${s.name || '(no name)'}</div>
      <div class="em">${s.email || ''}</div>
      <div class="pc">${pctOf(s.fields)}% complete</div>
    </div>`).join('');
  $('list').querySelectorAll('.student').forEach(el => {
    el.onclick = () => openStudent(el.dataset.uid);
  });
}

async function openStudent(uid) {
  current = students.find(s => s.uid === uid);
  $('list').querySelectorAll('.student').forEach(el =>
    el.classList.toggle('active', el.dataset.uid === uid));
  $('who-title').textContent = `${current.name || current.email} — ${pctOf(current.fields)}% complete`;

  let grades = {};
  try {
    const g = await getDoc(doc(db, 'grades', uid));
    if (g.exists()) grades = g.data().units || {};
  } catch(e){}

  const f = current.fields || {};
  // group keys by unit id (a1, a7, proj3 ...)
  const unitIds = [...new Set(Object.keys(f)
    .map(k => k.split('.')[0]))].sort((a,b) => {
      const na = parseInt(a.replace(/\D/g,''))||0, nb = parseInt(b.replace(/\D/g,''))||0;
      return na - nb;
    });

  if (!unitIds.length) {
    $('detail').innerHTML = '<div class="empty">No work recorded yet.</div>';
    return;
  }

  $('detail').innerHTML = unitIds.map(u => {
    const evKeys = Object.keys(f).filter(k => k.startsWith(u + '.e'));
    const done = evKeys.filter(k => f[k]===true).length;
    const submitted = f[`${u}.submitted`];
    const g = grades[u] || {};
    const badge = g.score != null
      ? `<span class="badge b-graded">${g.score}/10</span>`
      : submitted ? `<span class="badge b-sub">Submitted</span>` : '';
    return `
    <div class="unit">
      <h4>${u.toUpperCase()} ${badge}
        <span style="margin-left:auto;font-weight:400;color:#777">
          ${done}/${evKeys.length} evidence</span></h4>
      <div class="unit-body">
        ${evKeys.map(k => `<div class="ev ${f[k]?'on':'off'}">${k.split('.')[1]}</div>`).join('')}
        <div class="meta">
          <strong>Evidence link:</strong>
          ${f[`${u}.link`] ? `<a href="${f[`${u}.link`]}" target="_blank">${f[`${u}.link`]}</a>` : '<em>none</em>'}
          ${f[`${u}.notes`] ? `<br><strong>Notes:</strong> ${f[`${u}.notes`]}` : ''}
          ${f[`${u}.submittedAt`] ? `<br><strong>Submitted:</strong> ${new Date(f[`${u}.submittedAt`]).toLocaleString()}` : ''}
        </div>
        <div class="grade-row">
          <div><label>Score /10</label>
            <input type="number" min="0" max="10" step="0.5"
              id="sc_${u}" value="${g.score != null ? g.score : ''}"></div>
          <div style="flex:1"><label>Feedback</label>
            <textarea id="fb_${u}">${g.feedback || ''}</textarea></div>
          <button data-save="${u}">Save Grade</button>
        </div>
        <div class="hint">10 = all evidence + bonus · 8–9 = all required, minor issues ·
          6–7 = most evidence · 4–5 = partial · &lt;4 = little/none</div>
      </div>
    </div>`;
  }).join('');

  $('detail').querySelectorAll('[data-save]').forEach(btn => {
    btn.onclick = () => saveGrade(uid, btn.dataset.save);
  });
}

async function saveGrade(uid, unit) {
  const score = $(`sc_${unit}`).value;
  const feedback = $(`fb_${unit}`).value;
  try {
    await setDoc(doc(db, 'grades', uid), {
      units: { [unit]: {
        score: score === '' ? null : Number(score),
        feedback,
        gradedBy: auth.currentUser.email,
        gradedAt: new Date().toISOString(),
      }},
      updatedAt: serverTimestamp(),
    }, { merge: true });
    $('status').textContent = `Saved ${unit.toUpperCase()} for ${current.name || current.email}`;
    setTimeout(() => $('status').textContent = '', 2500);
    openStudent(uid);
  } catch (e) {
    $('status').textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
